# Brahmastra strategy - settings
# Run:  python fetch_data.py --config config.yml
#       python brahmastra_backtest.py --config config.yml
# Command-line flags override values in this file.

data:
  exchange: mexc            # mexc | gate
  symbols: [BTC_USDT, ETH_USDT, SOL_USDT, XRP_USDT, BNB_USDT]   # edit freely
  days: 365                 # history to download (5m candles)
  folder: data              # where CSVs are saved / read from

backtest:
  timeframes: [5m, 15m, 1h, 4h, 1d, 1w, 1M]
  output_folder: results

strategy:
  supertrend_period: 20
  supertrend_multiplier: 2.0
  macd_lookback: 2          # accept MACD cross this many candles BEFORE the signal candle (and any time after it, until entry)
  wait_bars: 3              # candles after signal candle in which the high/low breakout may trigger (1 = strictly next candle)
  vwap_mode: reversal       # reversal: long if price already BELOW VWAP, short if already ABOVE | trend: long above, short below
  allow_long: true
  allow_short: true         # spot exchanges cannot short - set false for spot-only

costs:
  fee_pct: 0.1              # per side
  slippage_pct: 0.05        # per side
  tds_pct: 0.0              # India TDS on sell (1.0 for real-world INR trading)

risk:
  allocation: 1.0           # fraction of equity per trade (1.0 = all-in, no leverage)

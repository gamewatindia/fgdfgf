name: LuxAlgo Pivot Reversal Backtest

on:
  workflow_dispatch:
    inputs:

      pair:
        description: "Shark Exchange USDT pair"
        required: true
        default: "BRUSDT"

      days:
        description: "Historical days"
        required: true
        default: "30"

      price_type:
        description: "Price type"
        required: true
        default: "LAST_PRICE"
        type: choice
        options:
          - LAST_PRICE
          - MARK_PRICE


jobs:

  backtest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests


      - name: Run LuxAlgo backtest
        run: |
          python luxalgo_backtest.py \
            --pair "${{ github.event.inputs.pair }}" \
            --days "${{ github.event.inputs.days }}" \
            --price-type "${{ github.event.inputs.price_type }}"


      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: luxalgo-${{ github.event.inputs.pair }}-results
          path: results/

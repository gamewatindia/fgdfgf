name: Pivot Backtest

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "USDT Pair"
        required: true
        default: "BTCUSDT"

      days:
        description: "Historical days"
        required: true
        default: "30"

      price:
        description: "Candle price type"
        required: true
        type: choice
        default: "LAST_PRICE"
        options:
          - LAST_PRICE
          - MARK_PRICE
          - INDEX_PRICE

      leverage:
        description: "Leverage (x)"
        required: false
        default: "10"

      margin:
        description: "Margin per trade (Rs)"
        required: false
        default: "1000"

      stop_loss:
        description: "Stop-loss % of price (0 = off)"
        required: false
        default: "0"

      first_exchange:
        description: "Preferred exchange"
        required: false
        default: ""

      length:
        description: "Pivot length"
        required: false
        default: "50"


jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy ccxt matplotlib


      - name: Run backtest
        env:
          PAIR: ${{ inputs.pair }}
          DAYS: ${{ inputs.days }}
          PRICE: ${{ inputs.price }}
          LEVERAGE: ${{ inputs.leverage }}
          MARGIN: ${{ inputs.margin }}
          STOP_LOSS: ${{ inputs.stop_loss }}
          FIRST_EXCHANGE: ${{ inputs.first_exchange }}
          LENGTH: ${{ inputs.length }}

        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "Repository files"
          echo "========================================"

          ls -lah

          echo ""
          echo "========================================"
          echo "Checking Python file"
          echo "========================================"

          FILE="./pivot_backtest.py"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: pivot_backtest.py nahi mili."
            echo ""
            echo "Available files:"
            ls -lah
            exit 1
          fi

          echo "Using Python file: $FILE"

          echo ""
          echo "========================================"
          echo "Running backtest"
          echo "========================================"

          python "$FILE" \
            --pair "$PAIR" \
            --days "$DAYS" \
            --price "$PRICE" \
            --lev "$LEVERAGE" \
            --margin "$MARGIN" \
            --sl "$STOP_LOSS" \
            --first "$FIRST_EXCHANGE" \
            --length "$LENGTH"

          echo ""
          echo "========================================"
          echo "Checking output files"
          echo "========================================"

          if [ ! -f "backtest_summary.csv" ]; then
            echo "ERROR: backtest_summary.csv nahi bani."
            exit 1
          fi

          if [ ! -f "backtest_all_trades.csv" ]; then
            echo "ERROR: backtest_all_trades.csv nahi bani."
            exit 1
          fi

          if [ ! -f "equity_all.png" ]; then
            echo "ERROR: equity_all.png nahi bani."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "BACKTEST COMPLETED SUCCESSFULLY"
          echo "========================================"

          ls -lh \
            backtest_summary.csv \
            backtest_all_trades.csv \
            equity_all.png


      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: |
           
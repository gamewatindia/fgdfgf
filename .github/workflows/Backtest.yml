      - name: Run backtest - all timeframes
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Repository files"
          echo "=========================================="

          ls -lah

          echo ""
          echo "=========================================="
          echo "Finding Pivot backtest file"
          echo "=========================================="

          FILE=$(find . -maxdepth 1 -type f -iname 'pivot backtest*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Pivot backtest file nahi mili."
            echo ""
            echo "Available files:"
            ls -lah
            exit 1
          fi

          echo "Using script: $FILE"

          echo ""
          echo "=========================================="
          echo "Starting backtest"
          echo "=========================================="

          python "$FILE" \
            --pair "${{ github.event.inputs.pair }}" \
            --days "${{ github.event.inputs.days }}" \
            --price "${{ github.event.inputs.price }}" \
            --lev "${{ github.event.inputs.leverage }}" \
            --margin "${{ github.event.inputs.margin }}" \
            --sl "${{ github.event.inputs.stop_loss }}" \
            --first "${{ github.event.inputs.first_exchange }}" \
            --length "${{ github.event.inputs.length }}"

          echo ""
          echo "=========================================="
          echo "Checking output files"
          echo "=========================================="

          test -f backtest_summary.csv
          test -f backtest_all_trades.csv
          test -f equity_all.png

          echo "BACKTEST COMPLETED SUCCESSFULLY"

          ls -lh \
            backtest_summary.csv \
            backtest_all_trades.csv \
            equity_all.png

name: Crypto Pivot Backtest (INR & Leverage)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      coin:
        description: 'Select Crypto Coin'
        required: true
        default: 'BTC'
        type: choice
        options:
          - BTC
          - ETH
          - SOL
          - DOGE
          - XRP
      timeframe:
        description: 'Select Timeframe'
        required: true
        default: '1h'
        type: choice
        options:
          - '15m'
          - '1h'
          - '4h'
          - '1d'
      trade_amount:
        description: 'Margin Per Trade (₹ INR)'
        required: true
        default: '1000'
      leverage:
        description: 'Leverage Multiplier'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '10'
      direction:
        description: 'Trade Direction'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'long_only'
          - 'short_only'
      strategy_type:
        description: 'Strategy Logic (Breakout recommended)'
        required: true
        default: 'breakout'
        type: choice
        options:
          - 'breakout'
          - 'reversal'
      pivot_length:
        description: 'Pivot Length'
        required: true
        default: '15'

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Libraries
        run: |
          pip install numpy pandas yfinance

      - name: Run Backtester
        run: |
          export COIN="${{ github.event.inputs.coin || 'BTC' }}"
          export TIMEFRAME="${{ github.event.inputs.timeframe || '1h' }}"
          export TRADE_AMOUNT="${{ github.event.inputs.trade_amount || '1000' }}"
          export LEVERAGE="${{ github.event.inputs.leverage || '5' }}"
          export DIRECTION="${{ github.event.inputs.direction || 'both' }}"
          export STRATEGY_TYPE="${{ github.event.inputs.strategy_type || 'breakout' }}"
          export PIVOT_LENGTH="${{ github.event.inputs.pivot_length || '15' }}"

          python backtest_pivots.py | tee output.log

      - name: Show Results in GitHub Summary
        if: always()
        run: |
          echo "## 🚀 Improved Backtest Summary (₹ INR)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

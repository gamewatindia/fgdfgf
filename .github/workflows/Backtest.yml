name: Pivot Backtest

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "USDT Pair"
        required: true
        default: "BTCUSDT"

      days:
        description: "Historical days"
        required: true
        default: "30"

      price:
        description: "Price type"
        required: true
        type: choice
        options:
          - LAST_PRICE
          - MARK_PRICE
          - INDEX_PRICE
        default: LAST_PRICE

      leverage:
        description: "Leverage"
        required: true
        default: "10"

      margin:
        description: "Margin per trade (Rs)"
        required: true
        default: "1000"

      sl:
        description: "SL % (0 = OFF)"
        required: true
        default: "0"

      length:
        description: "Pivot length"
        required: true
        default: "50"

jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy ccxt matplotlib

      - name: Run pivot backtest
        run: |
          echo "========================================"
          echo "RUNNING PIVOT BACKTEST"
          echo "========================================"

          echo "Repository files:"
          ls -lah

          echo ""
          echo "Python file:"
          ls -lh ./pivot_backtest.py

          echo ""
          echo "Starting backtest..."

          python ./pivot_backtest.py \
            --pair "${{ inputs.pair }}" \
            --days "${{ inputs.days }}" \
            --price "${{ inputs.price }}" \
            --lev "${{ inputs.leverage }}" \
            --margin "${{ inputs.margin }}" \
            --sl "${{ inputs.sl }}" \
            --length "${{ inputs.length }}"

          echo ""
          echo "========================================"
          echo "BACKTEST FINISHED"
          echo "========================================"

          echo ""
          echo "Output files:"
          ls -lh backtest_all_trades.csv backtest_summary.csv equity_all.png

      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pivot-backtest-results
          path: |
            backtest_all_trades.csv
            backtest_summary.csv
            equity_all.png
          if-no-files-found: error
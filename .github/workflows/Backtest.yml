name: Crypto Pivot Backtest (INR & Leverage)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      coin:
        description: 'Select Coin'
        required: true
        default: 'ETH'
        type: choice
        options:
          - ETH
          - SOL
          - BTC
          - DOGE
      period:
        description: 'Lookback Period'
        required: true
        default: '30d'
        type: choice
        options:
          - '30d'
          - '60d'
          - '180d'
          - '360d'
      timeframe:
        description: 'Timeframe (1h recommended)'
        required: true
        default: '1h'
        type: choice
        options:
          - '1h'
          - '15m'
          - '4h'
      trade_amount:
        description: 'Margin Per Trade (₹ INR)'
        required: true
        default: '1000'
      leverage:
        description: 'Leverage Multiplier'
        required: true
        default: '10'
        type: choice
        options:
          - '10'
          - '5'
          - '3'
      pivot_length:
        description: 'Pivot Length'
        required: true
        default: '3'

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Libraries
        run: |
          pip install numpy pandas yfinance

      - name: Run Backtester
        run: |
          export COIN="${{ github.event.inputs.coin || 'ETH' }}"
          export PERIOD="${{ github.event.inputs.period || '30d' }}"
          export TIMEFRAME="${{ github.event.inputs.timeframe || '1h' }}"
          export TRADE_AMOUNT="${{ github.event.inputs.trade_amount || '1000' }}"
          export LEVERAGE="${{ github.event.inputs.leverage || '10' }}"
          export PIVOT_LENGTH="${{ github.event.inputs.pivot_length || '3' }}"

          python backtest_pivots.py | tee output.log

      - name: Show Results in GitHub Summary
        if: always()
        run: |
          echo "## 🚀 Adaptive Backtest Summary (₹ INR)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

name: Run Pivot Points Backtest

# Controls when the workflow will run
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Allows you to manually trigger the backtest from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      pivot_length:
        description: 'Pivot Length (Bars to Confirm)'
        required: true
        default: '15'
      strategy_type:
        description: 'Strategy Type (reversal or breakout)'
        required: true
        default: 'reversal'
        type: choice
        options:
          - reversal
          - breakout
  # Optional: Run on a schedule (e.g., every Monday at 00:00 UTC)
  # schedule:
  #   - cron: '0 0 * * 1'

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Caches pip dependencies for faster runs

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas yfinance
          fi

      # Step 4: Run the backtest script
      - name: Execute Backtester
        id: run_backtest
        run: |
          # Pass workflow inputs as environment variables if triggered manually
          export PIVOT_LENGTH="${{ github.event.inputs.pivot_length || '15' }}"
          export STRATEGY_TYPE="${{ github.event.inputs.strategy_type || 'reversal' }}"
          
          # Run python and pipe output to terminal and a log file
          python backtest_pivots.py | tee backtest_output.log

      # Step 5: Publish Results to GitHub Job Summary (visible in GitHub UI)
      - name: Publish Summary to GitHub
        if: always()
        run: |
          echo "## 📊 Pivot Points Backtest Results" >> $GITHUB_STEP_SUMMARY
          echo "Ran with length: **${{ github.event.inputs.pivot_length || '15' }}** | Strategy: **${{ github.event.inputs.strategy_type || 'reversal' }}**" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat backtest_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Step 6: Upload log file as an artifact
      - name: Upload Backtest Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-logs
          path: backtest_output.log

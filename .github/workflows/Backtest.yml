name: Pivot Backtest

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "USDT Pair (e.g. BTCUSDT)"
        required: true
        default: "BTCUSDT"

      days:
        description: "Historical days"
        required: true
        default: "30"

      price:
        description: "Candle price type"
        required: true
        type: choice
        default: "LAST_PRICE"
        options:
          - LAST_PRICE
          - MARK_PRICE
          - INDEX_PRICE

      leverage:
        description: "Leverage (x)"
        required: false
        default: "10"

      margin:
        description: "Margin per trade (Rs)"
        required: false
        default: "1000"

      stop_loss:
        description: "Stop-loss % of price (0 = off)"
        required: false
        default: "0"

      first_exchange:
        description: "Preferred exchange (optional, e.g. gateio)"
        required: false
        default: ""

      length:
        description: "Pivot length"
        required: false
        default: "50"


jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy ccxt matplotlib


      - name: Run pivot backtest
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Repository files"
          echo "=========================================="

          ls -lah

          echo ""
          echo "=========================================="
          echo "Checking pivot_backtest"
          echo "=========================================="

          FILE="./pivot_backtest"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: pivot_backtest file nahi mili."
            echo ""
            echo "Available files:"
            ls -lah
            exit 1
          fi

          echo "Using script: $FILE"

          echo ""
          echo "=========================================="
          echo "Starting backtest"
          echo "=========================================="

          python "$FILE" \
            --pair "${{ github.event.inputs.pair }}" \
            --days "${{ github.event.inputs.days }}" \
            --price "${{ github.event.inputs.price }}" \
            --lev "${{ github.event.inputs.leverage }}" \
            --margin "${{ github.event.inputs.margin }}" \
            --sl "${{ github.event.inputs.stop_loss }}" \
            --first "${{ github.event
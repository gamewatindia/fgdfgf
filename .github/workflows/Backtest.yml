name: Pivot Backtest

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "USDT Pair (e.g. BTCUSDT)"
        required: true
        default: "BTCUSDT"

      days:
        description: "Historical days"
        required: true
        default: "30"

      price_type:
        description: "Candle price type"
        required: true
        type: choice
        default: "LAST_PRICE"
        options:
          - LAST_PRICE
          - MARK_PRICE
          - INDEX_PRICE

      leverage:
        description: "Leverage (x)"
        required: false
        default: "10"

      margin:
        description: "Margin per trade (Rs)"
        required: false
        default: "1000"

      stop_loss:
        description: "Stop-loss % of price (0 = off)"
        required: false
        default: "0"

      first_exchange:
        description: "Preferred exchange, tried first (optional, e.g. gateio)"
        required: false
        default: ""

      length:
        description: "Pivot length"
        required: false
        default: "50"


jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================
      # PYTHON
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ================================================
      # INSTALL DEPENDENCIES
      # ================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy ccxt matplotlib


      # ================================================
      # RUN BACKTEST
      # ================================================

      - name: Run backtest (all 5 timeframes)
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Repository files"
          echo "=========================================="

          ls -lah

          echo ""
          echo "=========================================="
          echo "Checking backtest script"
          echo "=========================================="

          FILE="./luxalgo_backtest.py"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: luxalgo_backtest.py nahi mili."
            echo ""
            echo "Available files:"
            ls -lah
            exit 1
          fi

          echo "Using script: $FILE"

          echo ""
          echo "=========================================="
          echo "Starting backtest"
          echo "=========================================="

          python "$FILE" \
            --pair "${{ github.event.inputs.pair }}" \
            --days "${{ github.event.inputs.days }}" \
            --price "${{ github.event.inputs.price_type }}" \
            --lev "${{ github.event.inputs.leverage }}" \
            --margin "${{ github.event.inputs.margin }}" \
            --sl "${{ github.event.inputs.stop_loss }}" \
            --first "${{ github.event.inputs.first_exchange }}" \
            --length "${{ github.event.inputs.length }}"

          echo ""
          echo "=========================================="
          echo "Checking output files"
          echo "=========================================="

          if [ ! -f "backtest_summary.csv" ]; then
            echo "ERROR: backtest_summary.csv nahi bani."
            exit 1
          fi

          if [ ! -f "backtest_all_trades.csv" ]; then
            echo "ERROR: backtest_all_trades.csv nahi bani."
            exit 1
          fi

          if [ ! -f "equity_all.png" ]; then
            echo "ERROR: equity_all.png nahi bani."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "BACKTEST COMPLETED SUCCESSFULLY"
          echo "=========================================="

          ls -lh \
            backtest_summary.csv \
            backtest_all_trades.csv \
            equity_all.png


      # ================================================
      # UPLOAD RESULTS
      # ================================================

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest_summary.csv
            backtest_all_trades.csv
            equity_all.png
          if-no-files-found: error
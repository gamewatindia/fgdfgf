name: Pivot Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol (ccxt format)"
        default: "BTC/USDT"
      length:
        description: "Pivot length"
        default: "50"
      days:
        description: "Backtest days"
        default: "30"
  schedule:
    - cron: "30 2 * * *"

jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf: ["5m", "15m", "30m", "1h", "4h"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy ccxt matplotlib

      - name: Run backtest (${{ matrix.tf }})
        shell: bash
        run: |
          FILE=$(find . -maxdepth 1 -type f -iname 'pivot*backtest*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Script file nahi mili. Repo ke root me files:"
            ls -la
            exit 1
          fi
          echo "Using script: $FILE"
          python "$FILE" \
            --exchange binanceus \
            --symbol "${{ github.event.inputs.symbol || 'BTC/USDT' }}" \
            --tf ${{ matrix.tf }} \
            --length ${{ github.event.inputs.length || '50' }} \
            --days ${{ github.event.inputs.days || '30' }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-${{ matrix.tf }}
          path: |
            backtest_trades_*.csv
            equity_curve_*.png
          if-no-files-found: warn

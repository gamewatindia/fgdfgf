name: Pivot Backtest

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "USDT Pair"
        required: true
        default: "BTCUSDT"

      days:
        description: "Historical days"
        required: true
        default: "30"

      price:
        description: "Price type"
        required: true
        type: choice
        default: "LAST_PRICE"
        options:
          - LAST_PRICE
          - MARK_PRICE
          - INDEX_PRICE

      leverage:
        description: "Leverage"
        required: false
        default: "10"

      margin:
        description: "Margin"
        required: false
        default: "1000"

      stop_loss:
        description: "Stop Loss %"
        required: false
        default: "0"

      first_exchange:
        description: "First Exchange"
        required: false
        default: ""

      length:
        description: "Pivot Length"
        required: false
        default: "50"

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy ccxt matplotlib

      - name: Run backtest
        run: |
          echo "======================================"
          echo "RUNNING PIVOT BACKTEST"
          echo "======================================"

          ls -lah

          test -f "./pivot_backtest.py"

          python "./pivot_backtest.py" \
            --pair "${{ inputs.pair }}" \
            --days "${{ inputs.days }}" \
            --price "${{ inputs.price }}" \
            --lev "${{ inputs.leverage }}" \
            --margin "${{ inputs.margin }}" \
            --sl "${{ inputs.stop_loss }}" \
            --first "${{ inputs.first_exchange }}" \
            --length "${{ inputs.length }}"

          echo ""
          echo "======================================"
          echo "OUTPUT FILES"
          echo "======================================"

          ls -lah *.csv *.png 2>/dev/null || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pivot-backtest-results
          path: |
            backtest_summary.csv
            backtest_all_trades.csv
            equity_all.png
          if-no-files-found: warn
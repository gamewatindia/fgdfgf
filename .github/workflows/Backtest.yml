name: Pivot Backtest

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "USDT Pair (e.g. BTCUSDT)"
        required: true
        default: "BTCUSDT"
      days:
        description: "Timeline - last N days"
        required: true
        type: choice
        default: "30"
        options:
          - "7"
          - "15"
          - "30"
          - "45"
          - "60"
          - "90"
          - "180"
          - "270"
          - "365"
      price_type:
        description: "Candle price type"
        required: true
        type: choice
        default: "LAST_PRICE"
        options:
          - LAST_PRICE
          - MARK_PRICE
          - INDEX_PRICE
      mode:
        description: "Mode (reverse / reverse_pivot_price / hold_long / hold_short / hold_both)"
        required: true
        type: choice
        default: "reverse"
        options:
          - reverse
          - reverse_pivot_price
          - hold_long
          - hold_short
          - hold_both
      leverage:
        description: "Leverage (x)"
        required: false
        default: "10"
      stop_loss:
        description: "Stop-loss % of price (0 = off, ignored in hold modes)"
        required: false
        default: "0"
      take_profit:
        description: "Take-profit % of price (0 = off; hold modes need it, 5 = +50% on 10x)"
        required: false
        default: "0"
      balance:
        description: "Cross-margin account balance Rs (hold modes only)"
        required: false
        default: "10000"
      first_exchange:
        description: "Preferred exchange, tried first (optional, e.g. gateio)"
        required: false
        default: ""
      length:
        description: "Pivot length (optional)"
        required: false
        default: "50"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy ccxt matplotlib

      - name: Run backtest (all 5 timeframes)
        shell: bash
        run: |
          FILE=$(find . -maxdepth 1 -type f -iname 'pivot*backtest*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Script file nahi mili:"; ls -la; exit 1
          fi
          echo "Using script: $FILE"
          python "$FILE" \
            --pair "${{ github.event.inputs.pair }}" \
            --days "${{ github.event.inputs.days }}" \
            --price "${{ github.event.inputs.price_type }}" \
            --mode "${{ github.event.inputs.mode }}" \
            --lev "${{ github.event.inputs.leverage || '10' }}" \
            --sl "${{ github.event.inputs.stop_loss || '0' }}" \
            --tp "${{ github.event.inputs.take_profit || '0' }}" \
            --balance "${{ github.event.inputs.balance || '10000' }}" \
            --first "${{ github.event.inputs.first_exchange }}" \
            --length "${{ github.event.inputs.length || '50' }}"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: |
            backtest_summary.csv
            backtest_all_trades.csv
            backtest_pivots.csv
            equity_all.png
          if-no-files-found: warn
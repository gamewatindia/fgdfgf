name: Pivot Backtest

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "USDT Pair. BTCUSDT@mexc = use ONLY mexc. With scan on: ALL, ALL@mexc or A,B,C"
        required: true
        default: "BTCUSDT"
      days:
        description: "Timeline - last N days"
        required: true
        type: choice
        default: "30"
        options:
          - "7"
          - "15"
          - "30"
          - "45"
          - "60"
          - "90"
          - "180"
          - "270"
          - "365"
      price_type:
        description: "Candle price type"
        required: true
        type: choice
        default: "LAST_PRICE"
        options:
          - LAST_PRICE
          - MARK_PRICE
          - INDEX_PRICE
      mode:
        description: "Mode (reverse / reverse_pivot_price / hold_long / hold_short / hold_both)"
        required: true
        type: choice
        default: "reverse"
        options:
          - reverse
          - reverse_pivot_price
          - hold_long
          - hold_short
          - hold_both
      leverage:
        description: "Leverage (x)"
        required: false
        default: "10"
      stop_loss:
        description: "Stop-loss: 4 = 4% of price | pivot = exit when pivot level breaks | pivot,4 = whichever first | 0 = off (not used in hold modes)"
        required: false
        default: "0"
      take_profit:
        description: "Take-profit % of price (0 = off; hold modes need it, 5 = +50% on 10x)"
        required: false
        default: "0"
      balance:
        description: "Cross-margin account balance Rs (hold modes only)"
        required: false
        default: "10000"
      open_range:
        description: "Simultaneous trades min-max, hold modes only (e.g. 1-3, 0-0 = no limit)"
        required: false
        default: "0-0"
      scan:
        description: "Pump/dump scan: 0 = off. 40 = coins with a 40%+ PUMP or DUMP inside 24h. Full: pct,exchange,maxscan,maxtest,hours,rotate e.g. 40,gate,300,15,24,1 (rotate 1 = one coin at a time, failed coin dropped)"
        required: false
        default: "0"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy ccxt matplotlib openpyxl

      - name: Run backtest (all 5 timeframes)
        shell: bash
        run: |
          if [ -f pivot_backtest.py ]; then
            FILE=pivot_backtest.py
          else
            FILE=$(find . -maxdepth 1 -type f -iname 'pivot*backtest*' | head -n 1)
          fi
          if [ -z "$FILE" ]; then
            echo "Script file nahi mili:"; ls -la; exit 1
          fi
          echo "Using script: $FILE"
          if ! grep -q "END_OF_SCRIPT" "$FILE"; then
            echo "ERROR: script file adhoori hai (copy-paste beech me kat gaya). Poori file dobara upload karo."
            exit 1
          fi
          python -m py_compile "$FILE" || { echo "ERROR: script me syntax error"; exit 1; }
          RANGE="${{ github.event.inputs.open_range || '0-0' }}"
          case "$RANGE" in *-*) ;; *) RANGE="0-$RANGE" ;; esac
          MIN_OPEN="${RANGE%-*}"
          MAX_OPEN="${RANGE#*-}"
          python "$FILE" \
            --pair "${{ github.event.inputs.pair }}" \
            --days "${{ github.event.inputs.days }}" \
            --price "${{ github.event.inputs.price_type }}" \
            --mode "${{ github.event.inputs.mode }}" \
            --lev "${{ github.event.inputs.leverage || '10' }}" \
            --sl "${{ github.event.inputs.stop_loss || '0' }}" \
            --tp "${{ github.event.inputs.take_profit || '0' }}" \
            --balance "${{ github.event.inputs.balance || '10000' }}" \
            --min_open "$MIN_OPEN" \
            --max_open "$MAX_OPEN" \
            --scan "${{ github.event.inputs.scan || '0' }}" \
            --out results

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-run${{ github.run_number }}
          path: results/
          if-no-files-found: warn

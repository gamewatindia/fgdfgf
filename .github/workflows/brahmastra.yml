name: Brahmastra Backtest

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: "Exchange to download data from"
        type: choice
        options: [mexc, gate]
        default: mexc
      interval:
        description: "Candle size to download (Gate 5m = only ~34 days; use 1h for ~1 year)"
        type: choice
        options: [5m, 15m, 1h, 4h, 1d]
        default: 5m
      symbols:
        description: "Comma separated pairs (BASE_QUOTE)"
        type: string
        default: "BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT"
      days:
        description: "Days of history to download"
        type: string
        default: "365"
      vwap_mode:
        description: "reversal = long below VWAP / short above; trend = opposite"
        type: choice
        options: [reversal, trend]
        default: reversal
      margin_inr:
        description: "Margin per trade in Rs"
        type: string
        default: "1000"
      leverages:
        description: "Leverage scenarios, comma separated"
        type: string
        default: "5,10"
      fee_pct:
        description: "Fee per side in % of position (futures taker ~0.02-0.05)"
        type: string
        default: "0.02"
      slip_pct:
        description: "Slippage per side in %"
        type: string
        default: "0.02"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests pyyaml matplotlib

      - name: Download data
        env:
          EXCHANGE: ${{ inputs.exchange }}
          INTERVAL: ${{ inputs.interval }}
          SYMBOLS: ${{ inputs.symbols }}
          DAYS: ${{ inputs.days }}
        run: python fetch_data.py --exchange "$EXCHANGE" --interval "$INTERVAL" --symbols "$SYMBOLS" --days "$DAYS" --out data

      - name: Run backtest
        env:
          VWAP_MODE: ${{ inputs.vwap_mode }}
          MARGIN: ${{ inputs.margin_inr }}
          LEVS: ${{ inputs.leverages }}
          FEE: ${{ inputs.fee_pct }}
          SLIP: ${{ inputs.slip_pct }}
        run: python brahmastra_backtest.py --data data --out results --vwap-mode "$VWAP_MODE" --margin "$MARGIN" --leverages "$LEVS" --fee "$FEE" --slip "$SLIP" | tee results_console.txt

      - name: Show summary in run page
        if: always()
        run: |
          if [ -f results_console.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat results_console.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brahmastra-results
          path: |
            results/
            results_console.txt
          if-no-files-found: warn

name: SR Filter Backtest

on:
  workflow_dispatch:        # GitHub me "Run workflow" button se manually chalao
  schedule:
    - cron: "30 2 * * 1"    # Har Monday 08:00 IST (02:30 UTC)

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install
        run: pip install ccxt pandas numpy

      - name: Backtest run
        run: python sr_filter_backtest.py

      - name: Trades CSV save karo
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: backtest_trades.csv

name: Shark Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Kya chalana hai?"
        type: choice
        default: backtest
        options:
          - backtest   # poora backtest (S/R filter vs baseline)
          - scan       # last 110 candles se abhi ke valid signals
          - coins      # Shark se saare coins nikalke shark_coins.txt banao
          - probe      # API check (raw response)
  # Automatic chalana ho to neeche wali 2 lines se '#' hata do (private repo me Actions minutes zyada lagenge)
  # schedule:
  #   - cron: "30 2 * * 1"   # har Monday 08:00 IST

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # 334 coins + 60 req/min limit => time lagta hai

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install
        run: pip install requests pandas numpy

      - name: Candle cache restore (dubara run tez hoga)
        uses: actions/cache@v4
        with:
          path: shark_cache
          key: shark-cache-${{ github.run_id }}
          restore-keys: shark-cache-

      - name: Coins list banao (agar shark_coins.txt repo me nahi hai)
        if: ${{ hashFiles('shark_coins.txt') == '' }}
        run: python shark_backtest.py coins

      - name: Script run
        run: |
          MODE="${{ github.event.inputs.mode || 'backtest' }}"
          if [ "$MODE" = "backtest" ]; then
            python shark_backtest.py
          elif [ "$MODE" = "probe" ]; then
            python shark_backtest.py probe BTCUSDT
          else
            python shark_backtest.py "$MODE"
          fi

      - name: Results save karo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shark-results
          path: |
            backtest_trades.csv
            per_coin_summary.csv
            scan_signals.csv
            shark_coins.txt
          if-no-files-found: ignore

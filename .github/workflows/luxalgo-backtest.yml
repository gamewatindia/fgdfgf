name: Shark LuxAlgo Backtest

on:
  workflow_dispatch:
    inputs:

      pair:
        description: "Shark USDT Pair"
        required: true
        default: "BTCUSDT"

      days:
        description: "Historical days"
        required: true
        default: "30"

      price_type:
        description: "Price Type"
        required: true
        type: choice
        options:
          - LAST_PRICE
          - MARK_PRICE
        default: LAST_PRICE

jobs:

  backtest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Shark LuxAlgo Backtest
        run: |
          python luxalgo_backtest.py \
            --pair "${{ inputs.pair }}" \
            --days "${{ inputs.days }}" \
            --price-type "${{ inputs.price_type }}" \
            --output results

      - name: Show Summary
        run: |
          echo "======================================"
          echo "BACKTEST SUMMARY"
          echo "======================================"
          cat results/summary.csv

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: luxalgo-backtest-results
          path: results/
